name: smart_diy_store
description: "SmartDiyStore (SDS) - Feature-First Clean Architecture Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture, State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Freezed & Serialization Annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Firebase Core & Backend Services
  firebase_core: ^3.10.1
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # Utilities & Helpers
  file_picker: ^13.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.1.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
